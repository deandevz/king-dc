<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; background: #313338; font-family: 'Public Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #8ba4f2; text-decoration: none; }
    a:hover { color: #adbef7; text-decoration: underline; }
  </style>
</helmet>

<div style="width: 1440px; height: 900px; background: #1e1f22; background-image: radial-gradient(900px 520px at 22% -10%, rgba(75, 110, 229, 0.20), transparent 62%), radial-gradient(760px 480px at 88% 108%, rgba(47, 178, 107, 0.10), transparent 60%); display: flex; align-items: center; justify-content: center; box-sizing: border-box;">

  <div style="display: flex; flex-direction: column; align-items: center; gap: 20px;">

    <div style="width: 440px; background: #2b2d31; border: 1px solid #3f4147; border-radius: 8px; padding: 32px; box-sizing: border-box; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.36); display: flex; flex-direction: column; gap: 20px;">

      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <div style="width: 40px; height: 40px; border-radius: 8px; background: #4b6ee5; display: flex; align-items: center; justify-content: center; color: #ffffff; font-size: 16px; font-weight: 700; letter-spacing: 0.01em;">KD</div>
          <div style="color: #f2f3f5; font-size: 20px; font-weight: 700; letter-spacing: -0.01em;">King DC</div>
        </div>
        <div style="color: #f2f3f5; font-size: 23px; font-weight: 700; margin-top: 6px;">Que bom te ver de novo</div>
        <div style="color: #b5bac1; font-size: 15px; text-align: center; line-height: 20px;">Entre com o código de convite do servidor.</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="color: #b5bac1; font-size: 12px; font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase;">Código de convite</div>
        <div style="position: relative; display: flex; align-items: center; height: 42px; background: #1e1f22; border: 1px solid #1e1f22; border-radius: 8px; padding: 0 12px; gap: 10px;">
          <span style="color: #949ba4; display: flex;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"></circle><path d="m10.7 12.3 9.3-9.3"></path><path d="m17 6 3 3"></path><path d="m14 9 2 2"></path></svg>
          </span>
          <span style="color: #f2f3f5; font-size: 15px; letter-spacing: 0.06em; font-weight: 500;">KING-7F2A-9C4D</span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="color: #b5bac1; font-size: 12px; font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase;">Senha</div>
        <div style="display: flex; align-items: center; height: 42px; background: #1e1f22; border: 1px solid #4b6ee5; border-radius: 8px; padding: 0 12px; gap: 10px;">
          <span style="color: #949ba4; display: flex;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
          </span>
          <span style="color: #f2f3f5; font-size: 16px; letter-spacing: 0.18em;">••••••••••</span>
          <span style="width: 2px; height: 18px; background: #4b6ee5; margin-left: 1px;"></span>
        </div>
        <a href="#" style="font-size: 13px; font-weight: 500;">Esqueci minha senha</a>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px;">
        <div style="height: 44px; border-radius: 8px; background: #4b6ee5; display: flex; align-items: center; justify-content: center; color: #ffffff; font-size: 16px; font-weight: 600;">Entrar</div>
        <div style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #949ba4;">
          <span>Ainda não tem convite?</span>
          <a href="#" style="font-weight: 500;">Fale com o admin do servidor</a>
        </div>
      </div>

    </div>

    <div style="display: flex; align-items: center; gap: 8px; color: #6d7178; font-size: 12px;">
      <span style="width: 6px; height: 6px; border-radius: 50%; background: #2fb26b; display: inline-block;"></span>
      <span>Servidor interno · 20 vagas · São Paulo</span>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
